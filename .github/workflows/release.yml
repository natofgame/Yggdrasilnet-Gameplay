name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package behavior packs
        run: zip -qr "Yggdrasilnet.Gameplay-${GITHUB_REF_NAME}.zip" . -x '.git/*' '.github/*'

      - uses: softprops/action-gh-release@v2
        with:
          files: Yggdrasilnet.Gameplay-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
